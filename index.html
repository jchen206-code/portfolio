<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" id="meta-description" content="Personal portfolio." />

  <!-- Open Graph / link previews (filled in from assets/data.js) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" id="og-title" content="Portfolio" />
  <meta property="og:description" id="og-description" content="Personal portfolio." />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128188;</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===================== HEADER ===================== -->
  <header class="site-header" id="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" id="brand-initials" aria-hidden="true"></span>
        <span class="brand-name" id="brand-name"></span>
      </a>

      <nav class="nav" aria-label="Section navigation">
        <a href="#about" class="nav-link">About</a>
        <a href="#skills" class="nav-link">Skills</a>
        <a href="#projects" class="nav-link">Projects</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <button class="icon-btn" id="theme-toggle" type="button"
              aria-label="Switch color theme" title="Switch color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2v2.6M12 19.4V22M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2 12h2.6M19.4 12H22M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1Z" />
        </svg>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- ===================== HERO / PERSONAL STATEMENT ===================== -->
    <section class="hero" id="top">
      <div class="wrap">
        <p class="hero-eyebrow" id="hero-location"></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-title" id="hero-title"></p>

        <!-- Rubric: Personal Statement — one clear sentence -->
        <p class="hero-statement" id="hero-statement"></p>

        <div class="hero-actions">
          <ul class="contact-links" id="contact-links"></ul>
          <a class="btn btn-primary" id="resume-btn" href="#" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 3v12M12 15l-4.2-4.2M12 15l4.2-4.2M4 19h16" />
            </svg>
            Download résumé
          </a>
        </div>
      </div>
    </section>

    <!-- ===================== ABOUT ===================== -->
    <section class="section" id="about" hidden>
      <div class="wrap">
        <h2 class="section-title"><span class="section-num">01</span> About</h2>
        <div class="about-body" id="about-body"></div>
      </div>
    </section>

    <!-- ===================== SKILLS ===================== -->
    <section class="section section-alt" id="skills">
      <div class="wrap">
        <h2 class="section-title"><span class="section-num">02</span> Skills</h2>
        <p class="section-lede" id="skills-lede"></p>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <!-- ===================== PROJECTS ===================== -->
    <section class="section" id="projects">
      <div class="wrap">
        <h2 class="section-title"><span class="section-num">03</span> Projects</h2>
        <p class="section-lede" id="projects-lede"></p>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <!-- ===================== CONTACT ===================== -->
    <section class="section section-alt" id="contact">
      <div class="wrap contact-wrap">
        <h2 class="section-title"><span class="section-num">04</span> Contact</h2>
        <p class="section-lede" id="contact-lede"></p>
        <ul class="contact-links contact-links-lg" id="contact-links-footer"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
      <p class="footer-meta">
        Built with HTML, CSS &amp; JavaScript.
        <button type="button" class="linkish" id="open-editor">Edit content</button>
      </p>
    </div>
  </footer>

  <!-- =========================================================
       assets/data.js  ->  ALL page content lives there. Edit it
       by hand, or open this page with ?edit=1 for a form editor.
       ========================================================= -->
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/editor.js"></script>
</body>
</html>
